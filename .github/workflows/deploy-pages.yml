name: Deploy storefront to GitHub Pages

# Publishes the storefront to https://<user>.github.io/<repo>/ on every push
# to main. Turn it on once: repository Settings → Pages → Build and deployment
# → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pull the newest items and their artwork from the shop. IMVU being
      # unreachable must not stop the deploy — the committed products.json
      # is used as-is in that case.
      - run: npm run refresh-products
        continue-on-error: true

      - run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
