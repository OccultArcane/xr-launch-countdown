    <path d="M852 630 Q856 722 860 806 L865 816 Q871 728 879 630 Z" />
    <path d="M636 684 Q639 744 641 796 L646 804 Q651 750 656 684 Z" />
    <ellipse cx="657" cy="938" rx="8" ry="11" />
  </g>
