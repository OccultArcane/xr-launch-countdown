<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="768"
  viewBox="0 0 1024 768"
  role="img"
  aria-label="xr blackletter monogram"
>
  <!-- Interim stand-in silhouette for the binary mark mask, drawn as
       fraktur/blackletter X and R: heavy angular stems, wedge serifs,
       broken diagonal cuts and a lozenge at the crossing.
       For the exact letterforms, drop the real font file into /public
       and set SITE.maskFontFile. -->
  <g fill="#ffffff">
    <!-- X: heavy stroke, top-left down to bottom-right -->
    <path
      d="M126 96 L138 180 L176 252 L224 292 L232 360 L282 458 L334 556 L388 650 L420 712 L474 704 L438 628 L392 540 L346 452 L300 364 L268 300 L252 276 L210 190 L196 110 Z"
    />
    <!-- X: crossing stroke, top-right down to bottom-left -->
    <path
      d="M352 96 L336 180 L296 268 L256 360 L212 458 L166 556 L118 652 L96 712 L156 708 L196 630 L244 542 L288 454 L334 364 L376 276 L416 192 L438 112 Z"
    />
    <!-- X: lozenge at the crossing -->
    <path d="M300 372 L346 416 L300 462 L254 416 Z" />
    <!-- X: wedge serifs -->
    <path d="M126 96 L86 156 L152 140 Z" />
    <path d="M416 112 L468 78 L452 148 Z" />
    <path d="M96 712 L58 700 L104 656 Z" />
    <path d="M420 712 L472 744 L466 686 Z" />

    <!-- R: heavy stem with wedge foot -->
    <path
      d="M556 60 L636 86 L648 190 L656 306 L664 424 L672 544 L682 644 L724 706 L646 724 L624 646 L610 534 L600 414 L592 296 L582 184 L540 116 Z"
    />
    <!-- R: angular bowl ring (outer contour + counter, opposite winding) -->
    <path
      d="M620 92 L716 70 L838 78 L912 138 L894 244 L920 320 L872 396 L790 448 L694 462 L640 438 Z M696 404 L760 420 L822 384 L846 306 L822 232 L834 164 L762 136 L696 142 Z"
    />
    <!-- R: kicking leg with wedge terminal -->
    <path
      d="M666 440 L758 464 L846 552 L928 672 L968 720 L906 704 L836 612 L754 522 L660 476 Z"
    />
  </g>
</svg>
