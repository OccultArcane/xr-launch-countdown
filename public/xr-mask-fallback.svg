<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-label="xr dripping blackletter monogram"
>
  <!-- Interim stand-in silhouette for the binary mark mask, drawn in the
       "Midnight Grave" style: angular blackletter X and R with curved
       thorn barbs, tapering ink drips and falling droplets.
       For the exact letterforms, drop the real font file into /public
       and set SITE.maskFontFile. -->
  <g fill="#ffffff">
