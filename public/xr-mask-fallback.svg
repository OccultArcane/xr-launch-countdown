    <path d="M300 372 L346 416 L300 462 L254 416 Z" />

    <!-- X: curved thorn barbs -->
    <path d="M146 128 Q118 74 128 34 Q146 84 176 112 Z" />
    <path d="M196 262 Q150 246 128 214 Q158 274 206 292 Z" />
    <path d="M330 470 Q384 462 424 430 Q388 494 336 512 Z" />
    <path d="M410 130 Q436 76 424 36 Q404 88 376 116 Z" />
    <path d="M214 470 Q170 462 138 432 Q166 494 220 510 Z" />

