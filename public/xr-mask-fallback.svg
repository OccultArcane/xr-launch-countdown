    <path d="M112 704 Q116 800 120 880 L125 890 Q131 806 140 704 Z" />
    <path d="M289 456 Q293 540 296 610 L301 620 Q306 546 311 456 Z" />
    <ellipse cx="124" cy="918" rx="8" ry="11" />

    <!-- R: heavy stem with angled foot -->
